# Render Blueprint for OneVoice Tracker.
# In Render: New > Blueprint > pick this repository. Render will ask for each
# value marked "sync: false" (secrets you type in; they are never stored in git).
services:
  - type: web
    name: onevoice-tracker
    runtime: docker
    plan: starter          # paid plan: always on, so hourly filing checks and emails keep running
    region: ohio           # closest Render region to Oklahoma
    healthCheckPath: /healthz
    disk:
      name: tracker-data
      mountPath: /app/data # tracked bills, notes, settings and keywords live here
      sizeGB: 1
    envVars:
      # Sign-in
      - key: BILLTRACKER_PASSWORD
        sync: false
      # Alerts
      - key: BILLTRACKER_ALERT_TO
        sync: false
      - key: BILLTRACKER_URL
        sync: false
      # Email (ask your IT team, or see the README's Email setup section)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURITY
        value: starttls
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # AI summaries
      - key: ANTHROPIC_API_KEY
        sync: false
      # Session to follow (2700 = 2027 Regular Session)
      - key: BILLTRACKER_SESSION
        value: "2700"
